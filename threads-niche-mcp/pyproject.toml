[project]
name = "threads-niche-mcp"
version = "0.1.0"
description = "MCP server that scans Threads for income-proof posts and ranks profitable niches (US + CIS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
threads-niche-mcp = "threads_niche_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
